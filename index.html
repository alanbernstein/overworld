<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <script>
    // geolocation needs a secure context; localhost already is one, so local dev stays on http.
    // A dev server on a nonstandard port has its https side on 8443; a real host uses the default port.
    if (location.protocol !== 'https:' && !['localhost', '127.0.0.1'].includes(location.hostname))
      location.replace('https://' + location.hostname + (location.port ? ':8443' : '') + location.pathname + location.search + location.hash);
  </script>
  <title>Overworld</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="manifest" href="assets/manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Overworld">
  <link rel="apple-touch-icon" href="assets/icon-192.png">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- KML support -->
  <script src="https://unpkg.com/leaflet-kml@1.0.1/L.KML.js"></script>

  <!-- GPX support -->
  <script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

  <!-- KMZ support (zipped KML) -->
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>

  <!-- GeoTIFF support -->
  <script src="https://unpkg.com/geotiff@2.1.3/dist-browser/geotiff.js"></script>
  <script src="https://unpkg.com/georaster@1.6.0/dist/georaster.browser.bundle.min.js"></script>
  <script src="https://unpkg.com/georaster-layer-for-leaflet@4.1.2/dist/georaster-layer-for-leaflet.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }

    #map {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
    }

    #panel {
      position: absolute;

      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #panel.collapsed {
      width: auto;
    }

    #panel.collapsed #panel-content {
      display: none;
    }

    #panel-header {
      padding: 8px 12px;
      background: #2563eb;
      color: white;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    #panel-header:hover {
      background: #1d4ed8;
    }

    #toggle-btn {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      padding: 0;
    }

    #panel-content {
      overflow-y: auto;
      flex: 1;
    }

    .top-section {
      border-bottom: 2px solid #d1d5db;
    }

    .top-section:last-child {
      border-bottom: none;
    }

    .top-header {
      padding: 5px 12px;
      background: #eff6ff;
      font-weight: 700;
      font-size: 12px;
      color: #1d4ed8;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-header:hover {
      background: #dbeafe;
    }

    .top-section.collapsed .top-content {
      display: none;
    }

      border-bottom: 1px solid #e5e7eb;
    }

    .category:last-child {
      border-bottom: none;
    }

    .category-header {
      padding: 4px 12px;
      background: #f9fafb;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      color: #6b7280;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-header:hover {
      background: #f3f4f6;
    }

    .category-items {
      padding: 2px 0;
    }

    .category.collapsed .category-items {

<body>

<div id="map"></div>

<div id="panel">
  <div id="panel-header">
    <span>Overworld</span>
    <button id="toggle-btn">−</button>
  </div>
  <div id="panel-content">
    <div class="panel-section" id="geocode-section">
      <div class="panel-section-header">
        <span>Search</span>
        <span class="arrow">▼</span>
      </div>
      <div class="panel-section-content">
        <div id="geocode-bar">
          <input id="geocode-input" type="text" placeholder="Address or place name…" autocomplete="off" />
          <button id="geocode-submit">Search</button>
        </div>
        <div id="geocode-results"></div>
      </div>
    </div>
    <div class="panel-section" id="layers-section">
      <div class="panel-section-header">
        <span>Layers</span>
        <span class="arrow">▼</span>
      </div>
      <div class="panel-section-content">
        <div id="search-bar">
          <input id="search-input" type="text" placeholder="Filter layers…" autocomplete="off" />
          <button id="search-clear">×</button>
        </div>
        <div id="layers-content"></div>
      </div>
    </div>
  </div>
  <div id="status">Ready</div>
</div>

<script>
// Layer configuration loaded from the layer sets named in config.json
let LAYERS = {};  // Will be populated on load

// --- Data roots ---
// Layer configs name files by logical path (e.g. "seattle/streets.geojson"); the
// file itself can live in any of several roots: committed samples, a synced
// folder, a large-file folder on one machine, or a web server. config.json is
// per machine and gitignored; see config.example.json and the README.
//
// A root is either a URL string, whose _files.json listing (written by
// tools/index-data.py) says which files it holds — no listing means the root is
// absent on this machine — or {url, indexed: false}, which is assumed to hold
// anything not found in an indexed root.
const DEFAULT_APP_CONFIG = {
  roots: ['data/samples/', { url: 'data/', indexed: false }],
  layer_sets: [],             // extra layer sets; each root's layers/*.json load anyway
  hide_unavailable: false,
};
let APP_CONFIG = DEFAULT_APP_CONFIG;
let DATA_ROOTS = [];          // [{ url, files: Set | null }]

async function fetchJSON(url) {
  try {
    const r = await fetch(url);
    return r.ok ? await r.json() : null;
  } catch {
    return null;
  }
}

async function loadAppConfig() {
  const cfg = await fetchJSON('config.json');
  APP_CONFIG = { ...DEFAULT_APP_CONFIG, ...(cfg || {}) };

  DATA_ROOTS = (await Promise.all(APP_CONFIG.roots.map(async root => {
    const url = typeof root === 'string' ? root : root.url;
    const base = url.endsWith('/') ? url : url + '/';
    if (typeof root !== 'string' && root.indexed === false) return { url: base, files: null };
    const listing = await fetchJSON(base + '_files.json');
    return listing ? { url: base, files: new Set(listing) } : null;
  }))).filter(Boolean);

  // Layer sets kept with the data are found automatically: every layers/*.json in an
  // indexed root's listing. Like data files, a path in more than one root loads from the
  // first (the committed samples root carries layers/example.json this way). Explicit
  // layer_sets load too.
  const discovered = new Map();
  for (const root of DATA_ROOTS) {
    if (!root.files) continue;
    for (const f of root.files) {
      if (/^layers\/[^/]+\.json$/.test(f) && !discovered.has(f)) discovered.set(f, root.url + f);
    }
  }
  const abs = u => new URL(u, location.href).href;
  const sets = [...(APP_CONFIG.layer_sets || [])];
  const seen = new Set(sets.map(abs));
  for (const url of discovered.values()) {
    if (!seen.has(abs(url))) { seen.add(abs(url)); sets.push(url); }
  }
  APP_CONFIG.layer_sets = sets;
}

// CARTO basemaps need an API key (free for non-commercial use, carto.com/basemaps/apikey).
// It lives in the per-machine config.json as "carto_key", so it stays out of the repo.
// Without one, CARTO serves an "API KEY REQUIRED" placeholder tile.
function applyCartoKey() {
  const key = APP_CONFIG.carto_key;
  if (!key) {
    console.warn('No carto_key in config.json; CARTO basemaps will show a placeholder');
    return;
  }
  for (const { layer } of Object.values(BASE_LAYER_DEFS)) {
    if ('key' in layer.options) {
      layer.options.key = encodeURIComponent(key);
      layer.redraw();
    }
  }
}

// Logical data path -> URL, or null if no root on this machine has it
function resolveDataFile(path) {
  const hit = DATA_ROOTS.find(r => r.files && r.files.has(path))
           || DATA_ROOTS.find(r => r.files === null);
  return hit ? hit.url + path : null;
}

// Top-level display names keyed by data/ subdirectory name
const TOP_LEVEL_NAMES = {
  'austin':  'Austin',
  'seattle': 'Seattle',
  'texas':   'Texas',
  'usa':     'United States',
};
const TOP_LEVEL_ORDER = ['austin', 'seattle', 'texas', 'usa'];

// Default map view per region key
const REGION_VIEWS = {
  'austin':  { center: [30.2672, -97.7431], zoom: 11 },
  'seattle': { center: [47.6062, -122.3321], zoom: 11 },
  'texas':   { center: [31.0,    -100.0],   zoom: 6  },
  'usa':     { center: [38.0,    -96.0],    zoom: 4  },
};

// Subcategory display names keyed by tag
const SUB_CATEGORY_NAMES = {
  'bike':          'Bike',
  'trail':         'Trails',
  'transit':       'Transit',
  'school':        'Schools',
  'parks':         'Parks',
  'water':         'Water',
  'jurisdictions': 'Boundaries',
  'raster':        'Raster Overlays',
};
const SUB_CATEGORY_ORDER = ['bike', 'trail', 'transit', 'school', 'parks', 'water', 'jurisdictions', 'raster'];

// Parse layer configs into { topName: { subName: [layers] } }
function parseLayersConfig(rawLayers) {
  const organized = {};

  for (const entry of rawLayers) {
    let file = null, type = null, isTileUrl = false;
    if (entry.tile_url)                            { file = entry.tile_url;                        type = 'tile'; isTileUrl = true; }
    else if (entry.file_geojson)                   { file = entry.file_geojson;                    type = 'geojson'; }
    else if (entry.file_kml)                       { file = entry.file_kml;                        type = 'kml'; }
    else if (entry.file_csv)                       { file = entry.file_csv;                        type = 'csv'; }
    else if (entry.file_gpx)                       { file = entry.file_gpx;                        type = 'gpx'; }
    else if (entry.file_kmz)                       { file = entry.file_kmz;                        type = 'kmz'; }
    else if (entry.file_tif || entry.file_geotiff) { file = entry.file_tif || entry.file_geotiff;  type = 'geotiff'; }
    else if (entry.file) {
      const ext = entry.file.split('.').pop().toLowerCase();
      const BY_EXT = { geojson: 'geojson', kml: 'kml', kmz: 'kmz', gpx: 'gpx', csv: 'csv', tif: 'geotiff', tiff: 'geotiff' };
      if (BY_EXT[ext]) { file = entry.file; type = BY_EXT[ext]; }
    }
    // "render": "heat" draws a GeoJSON file's lines as a density heatmap
    if (entry.render === 'heat' && type === 'geojson') type = 'heat';

    if (!file || !entry.name) continue;

    const id = entry.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '');

    // Subcategory from tags
    const tags = (entry.tags || '').split(',').map(t => t.trim()).filter(Boolean);

    // Top level: tile layers use tags; file-based layers use first path component
    const topDir = isTileUrl
      ? (tags.find(t => TOP_LEVEL_NAMES[t]) || tags[0] || 'other')
      : file.split('/')[0];
    const topName = TOP_LEVEL_NAMES[topDir] || (topDir[0].toUpperCase() + topDir.slice(1));

    const subTags = tags.filter(t => t !== topDir);
    const subTag = subTags.find(t => SUB_CATEGORY_NAMES[t]) || subTags[0] || null;
    const subName = subTag
      ? (SUB_CATEGORY_NAMES[subTag] || subTag[0].toUpperCase() + subTag.slice(1))
      : 'Personal';

    if (!organized[topName]) organized[topName] = {};
    if (!organized[topName][subName]) organized[topName][subName] = [];

    const url = isTileUrl ? file : resolveDataFile(file);
    if (!url && APP_CONFIG.hide_unavailable) continue;

    organized[topName][subName].push({
      id,
      name: entry.name,
      file: url,
      path: isTileUrl ? null : file,
      available: !!url,
      type,
      source_url: entry.source_url || null,
      style_by: entry.style_by || null,
      label_by: entry.label_by || null,
      max_zoom: entry.max_zoom || null,
      attribution: entry.attribution || null,
      heat: entry.heat || null,
    });
  }

  // Sort top levels by TOP_LEVEL_ORDER
  const topRank = name => {
    const dir = Object.keys(TOP_LEVEL_NAMES).find(k => TOP_LEVEL_NAMES[k] === name);
    const i = TOP_LEVEL_ORDER.indexOf(dir || '');
    return i === -1 ? 999 : i;
  };

  // Sort subcategories by SUB_CATEGORY_ORDER, Personal last
  const subRank = name => {
    const tag = Object.keys(SUB_CATEGORY_NAMES).find(k => SUB_CATEGORY_NAMES[k] === name);
    const i = SUB_CATEGORY_ORDER.indexOf(tag || '');
    return i === -1 ? (name === 'Personal' ? 998 : 500) : i;
  };

  const sorted = {};
  for (const topName of Object.keys(organized).sort((a, b) => topRank(a) - topRank(b))) {
    sorted[topName] = {};
    for (const subName of Object.keys(organized[topName]).sort((a, b) => subRank(a) - subRank(b))) {
      sorted[topName][subName] = organized[topName][subName];
    }
  }

  return sorted;
}

// Distinct color palette for single-layer mode (12 distinct hues)
const DISTINCT_HUES = [0, 30, 60, 120, 180, 210, 270, 300, 330, 150, 240, 45];

// Convert HSL to hex
function hslToHex(h, s, l) {
  s /= 100;
  l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const k = (n + h / 30) % 12;
    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
    return Math.round(255 * color).toString(16).padStart(2, '0');
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}

// Get base hue for a layer by dividing the color wheel into N equal segments,
// where N = number of currently active vector layers.
function getLayerHue(layerId) {
  const activeArray = [...activeVectorLayers];
  const index = activeArray.indexOf(layerId);
  const n = activeArray.length;
  if (index === -1 || n === 0) return 0;
  return (index * 360 / n) % 360;
}

// Get distinct color (for single-layer mode)
function getDistinctColor(index) {
  const hue = DISTINCT_HUES[index % DISTINCT_HUES.length];
  return hslToHex(hue, 65, 45);
}

// Get shade of base hue (for multi-layer mode)
function getShade(baseHue, index) {
  const lightness = 35 + (index % 5) * 5;
  const saturation = 55 + ((index * 7) % 20);
  const hueVariation = ((index * 13) % 21) - 10;
  const hue = (baseHue + hueVariation + 360) % 360;
  return hslToHex(hue, saturation, lightness);
}

// Distances are shown in imperial units: feet below 1000 ft, then miles.
// A text label pinned to a point, as a divIcon marker. (Leaflet 1.9's standalone
// tooltips leave their element behind when removed, so they aren't used for this.)
// side: 'above' or 'right' of the point.
function mapLabel(latlng, html, cls, side) {
  return L.marker(latlng, { interactive: false, keyboard: false, icon: mapLabelIcon(html, cls, side) });
}
function mapLabelIcon(html, cls, side) {
  return L.divIcon({ className: `map-label ${side}`, html: `<span class="${cls}">${html}</span>`, iconSize: null });
}

function formatDistance(m) {
  const ft = m * 3.28084;
  if (ft < 1000) return `${Math.round(ft)} ft`;
  const mi = m / 1609.344;
  return `${mi < 10 ? mi.toFixed(2) : mi.toFixed(1)} mi`;
}

// --- Radius rings: a circle of a set distance around a pin or the user's location ---
const RADIUS_COLOR = '#7c3aed';
const RADIUS_CHOICES = [['¼', 0.25], ['½', 0.5], ['1', 1], ['2', 2]];   // miles
let radiusLayer = null;     // circle + label
let radiusAnchor = null;    // 'user' when it follows the location dot

function clearRadius() {
  if (radiusLayer) { map.removeLayer(radiusLayer); radiusLayer = null; }
  radiusAnchor = null;
}

function drawRadius(latlng, miles, anchor) {
  clearRadius();
  const meters = miles * 1609.344;
  const circle = L.circle(latlng, {
    radius: meters, color: RADIUS_COLOR, weight: 2, dashArray: '6 5',
    fillColor: RADIUS_COLOR, fillOpacity: 0.06, interactive: false,
  });
  const label = mapLabel(latlng, `${miles} mi`, 'radius-label', 'above');
  radiusLayer = L.layerGroup([circle, label]);
  radiusLayer._circle = circle;
  radiusLayer._label = label;
  radiusLayer._miles = miles;
  moveRadius(latlng);
  radiusLayer.addTo(map);
  radiusAnchor = anchor;
}

// Keep the ring and its label (at the top edge) centred on latlng
function moveRadius(latlng) {
  if (!radiusLayer) return;
  const c = L.latLng(latlng);
  radiusLayer._circle.setLatLng(c);
  const dLat = (radiusLayer._miles * 1609.344) / 111320;
  radiusLayer._label.setLatLng([c.lat + dLat, c.lng]);
}

// A popup row of toggle buttons: "<label> [a] [b] [c] <unit>". Clicking a button
// lights it and calls onPick(value); clicking the lit one calls onClear().
// label may be an element (to update it later).
function toggleRow(label, choices, unit, cls, onPick, onClear) {
  const row = document.createElement('div');
  row.className = 'popup-row';
  row.append(typeof label === 'string' ? Object.assign(document.createElement('span'), { textContent: label }) : label);
  const btns = [];
  for (const [text, value] of choices) {
    const btn = document.createElement('button');
    if (cls) btn.className = cls;
    btn.textContent = text;
    btn.onclick = () => {
      const on = btn.classList.contains('on');
      btns.forEach(b => b.classList.remove('on'));
      if (on) { onClear(); return; }
      btn.classList.add('on');
      onPick(value);
    };
    btns.push(btn);
    row.appendChild(btn);
  }
  row.appendChild(Object.assign(document.createElement('span'), { textContent: unit }));
  return row;
}

// "Radius: ¼ ½ 1 2 mi"; getLatLng is called on each click so a ring around the user
// starts at their current position.
function radiusRow(getLatLng, anchor) {
  return toggleRow('Radius:', RADIUS_CHOICES, 'mi', 'radius-btn',
    miles => drawRadius(getLatLng(), miles, anchor), clearRadius);
}

// Ordered list of property keys likely to hold a human-readable name
const NAME_KEYS = [
  'name', 'NAME', 'Name',
  'UNIT_NAME', 'ParkName', 'PARK_NAME',
  'school_name', 'mapLabel',
  'L_HOOD', 'S_HOOD',
  'JURISDICT_NM', 'JURISDICT_LABEL_NM', 'CityName',
  'planning_area_name', 'display_name', 'watershed_full_name',
  'location_name', 'district_name', 'jurisdiction_label',
  'TRAIL_SYST', 'ASSET_NAME', 'UNITDESC',
  'FULLNAME', 'FullName', 'full_name',
  'label', 'LABEL', 'title', 'TITLE',
];

// Pick the property to name features by: the layer's label_by if set,
// otherwise the NAME_KEYS entry with the most distinct values in this layer
// (ties go to the earlier key). E.g. sub-neighbourhoods have L_HOOD (20 values)
// and S_HOOD (94), so S_HOOD wins there.
function pickNameKey(features, override) {
  if (override) return override;
  let best = null, bestCount = 0;
  for (const key of NAME_KEYS) {
    const vals = new Set();
    for (const f of features || []) {
      const v = f.properties?.[key];
      if (v != null && String(v).trim()) vals.add(String(v).trim());
    }
    if (vals.size > bestCount) { best = key; bestCount = vals.size; }
  }
  return best;
}

// Get feature name from properties (nameKey: the layer's chosen property, if any)
function getFeatureName(props, nameKey = null) {
  if (!props) return '';
  if (nameKey) {
    const v = props[nameKey];
    if (v != null && String(v).trim()) return String(v).trim();
  }
  for (const key of NAME_KEYS) {
    const v = props[key];
    if (v && String(v).trim()) return String(v).trim();
  }
  // Composite fallbacks
  if (props.district_number) return `District ${props.district_number}`;
  if (props.council_district) return `District ${props.council_district}`;
  if (props.district) return `District ${props.district}`;
  if (props.garb_rt) return `Route ${props.garb_rt}${props.garb_day ? ' · ' + props.garb_day : ''}`;
  if (props.zipcode) return [props.zipcode, props.city, props.state].filter(Boolean).join(', ');
  if (props.elevation_ft != null) return `${props.elevation_ft} ft`;
  if (props.elevationM   != null) return `${props.elevationM} m`;
  return '';
}

// Get short summary for the status bar (name + 1-2 secondary details)
function getFeatureInfo(props, nameKey = null) {
  if (!props) return '';
  const name = getFeatureName(props, nameKey);
  const parts = name ? [name] : [];
  if (props.County1) parts.push(`County: ${props.County1}`);
  if (props.UNIT_TYPE) parts.push(props.UNIT_TYPE);
  if (props.receiving_waters) parts.push(`→ ${props.receiving_waters}`);
  if (props.CATEGORY) parts.push(props.CATEGORY);
  if (props.grades) parts.push(`Grades ${props.grades}`);
  if (props.asset_size) parts.push(`${props.asset_size} ac`);
  return parts.join(' · ');
}

// Keys to omit from the popup table
const POPUP_SKIP = new Set([
  ':id', ':version', ':created_at', ':updated_at',
  'objectid', 'OBJECTID', 'OBJECTID_1',
  'shape__area', 'shape__length', 'Shape__Area', 'Shape__Length',
  'FID', 'GLOBALID', 'GlobalID', 'gis_id', 'GIS_NOTES',
]);

// Build HTML table of all meaningful properties for a popup
function buildPopupHTML(props, nameKey = null) {
  if (!props) return '<em>No properties</em>';
  const name = getFeatureName(props, nameKey);
  const rows = [];
  for (const [k, v] of Object.entries(props)) {
    if (POPUP_SKIP.has(k) || k.startsWith(':')) continue;
    if (v === null || v === undefined || String(v).trim() === '') continue;
    const label = k.replace(/_/g, ' ').toLowerCase();
    let val = String(v);
    if (val.startsWith('http')) {
      const display = val.length > 45 ? val.slice(0, 42) + '…' : val;
      val = `<a href="${val}" target="_blank" rel="noopener">${display}</a>`;
    } else if (val.length > 300) {
      val = val.slice(0, 297) + '…';
    }
    rows.push(`<tr><td class="prop-key">${label}</td><td class="prop-val">${val}</td></tr>`);
  }
  const header = name ? `<div class="popup-name">${name}</div>` : '';
  const body = rows.length
    ? `<table class="prop-table">${rows.join('')}</table>`
    : '<em>No displayable properties</em>';
  return header + body;
}

// Status bar
function setStatus(msg, isHover = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.toggle('hover-info', isHover);
}

function clearHoverStatus() {
  setStatus('Ready');
}

// Check if in single-layer mode
function isSingleLayerMode() {
  return activeVectorLayers.size === 1;
}

const LABEL_LIMIT = 100;

// Bounding-box area as a proxy for feature size (works for polygons and lines)
function geometrySize(geom) {
  let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
  function scan(c) {
    if (typeof c[0] === 'number') {
      if (c[1] < minLat) minLat = c[1];
      if (c[1] > maxLat) maxLat = c[1];
      if (c[0] < minLon) minLon = c[0];
      if (c[0] > maxLon) maxLon = c[0];
    } else { c.forEach(scan); }
  }
  scan(geom.coordinates);
  return isFinite(minLat) ? (maxLat - minLat) * (maxLon - minLon) : 0;
}

// Create labels layer for a GeoJSON layer
function createLabelsLayer(data, nameKey = null) {
  const labels = L.layerGroup();

  if (!data.features) return labels;

  const candidates = [];

  data.features.forEach(feature => {
    const name = getFeatureName(feature.properties, nameKey);
    if (!name) return;

    const geom = feature.geometry;
    if (!geom) return;

    let lat, lng;
    if (geom.type === 'Point') {
      [lng, lat] = geom.coordinates;
    } else if (geom.type === 'Polygon') {
      const coords = geom.coordinates[0];
      lat = coords.reduce((s, c) => s + c[1], 0) / coords.length;
      lng = coords.reduce((s, c) => s + c[0], 0) / coords.length;
    } else if (geom.type === 'MultiPolygon') {
      const coords = geom.coordinates[0][0];
      lat = coords.reduce((s, c) => s + c[1], 0) / coords.length;
      lng = coords.reduce((s, c) => s + c[0], 0) / coords.length;
    } else {
      return;
    }

    candidates.push({ name, lat, lng, size: geometrySize(geom) });
  });

  candidates
    .sort((a, b) => b.size - a.size)
    .slice(0, LABEL_LIMIT)
    .forEach(({ name, lat, lng }) => {
      labels.addLayer(L.marker([lat, lng], {
        icon: L.divIcon({ className: 'feature-label', html: name, iconSize: null })
      }));
    });

  return labels;
}

// Apply styling to a GeoJSON layer
function styleGeoJSONLayer(layerId, layerData) {
  const { layer, config } = layerData;
  const { valuePalette } = layerData;
  const singleMode = isSingleLayerMode();

  let featureIndex = 0;
  const baseHue = getLayerHue(config.id);

  layer.eachLayer(featureLayer => {
    let color;
    if (valuePalette) {
      const val = featureLayer.feature?.properties?.[config.style_by];
      color = valuePalette[val] ?? '#888888';
    } else {
      color = singleMode
        ? getDistinctColor(featureIndex)
        : getShade(baseHue, featureIndex);
    }

    featureIndex++;

    if (featureLayer.setStyle) {
      featureLayer.setStyle({
        color: color,
        fillColor: color,
        weight: 2,
        fillOpacity: 0.25
      });
      // Store for hover reset
      featureLayer._baseStyle = { color, fillColor: color, weight: 2, fillOpacity: 0.25 };
    } else if (featureLayer.setRadius) {
      // CircleMarker
      featureLayer.setStyle({
        color: color,
        fillColor: color,
        weight: 1,
        fillOpacity: 0.7
      });
      featureLayer._baseStyle = { color, fillColor: color, radius: 5, weight: 1, fillOpacity: 0.7 };
    }
  });
}

// Update all active layers' styling and labels
function updateAllLayerStyles() {
  const singleMode = isSingleLayerMode();

  activeVectorLayers.forEach(layerId => {
    const layerData = loadedLayers[layerId];
    if (!layerData || ['kml', 'kmz', 'gpx'].includes(layerData.config.type)) return;

    styleGeoJSONLayer(layerId, layerData);

    // Toggle labels
    if (layerData.labels) {
      if (singleMode) {
        layerData.labels.addTo(map);
      } else {
        map.removeLayer(layerData.labels);
      }
    }
  });
  updateAllSwatches();
}

// Update color swatches in the layer panel
function updateAllSwatches() {
  const multiMode = activeVectorLayers.size > 1;
  for (const [layerId, swatch] of Object.entries(layerSwatches)) {
    if (multiMode && activeVectorLayers.has(layerId)) {
      swatch.style.display = 'inline-block';
      swatch.style.background = getShade(getLayerHue(layerId), 0);
    } else {
      swatch.style.display = 'none';
    }
  }
}

// Load GeoJSON layer
async function loadGeoJSON(config) {
  setStatus(`Loading ${config.name}...`);
  const response = await fetch(config.file);
  if (!response.ok) throw new Error(`HTTP ${response.status} for ${config.file}`);
  const data = await response.json();
  const nameKey = pickNameKey(data.features, config.label_by);

  const layer = L.geoJSON(data, {
    style: () => ({ weight: 2, fillOpacity: 0.25 }),
    pointToLayer: (feature, latlng) => L.circleMarker(latlng, { radius: 5 }),
    onEachFeature: (feature, featureLayer) => {
      featureLayer.bindPopup(() => buildPopupHTML(feature.properties, nameKey), { maxWidth: 340 });
      featureLayer.on({
        mouseover: (e) => {
          const l = e.target;
          const info = getFeatureInfo(feature.properties, nameKey);
          setStatus(info || 'Click for details', true);
          if (l.setStyle) {
            l.setStyle({ weight: 4, fillOpacity: 0.45 });
            l.bringToFront();
          } else if (l.setRadius) {
            l.setStyle({ radius: 8, weight: 2, fillOpacity: 0.9 });
          }
        },
        mouseout: (e) => {
          const l = e.target;
          clearHoverStatus();
          if (l._baseStyle) {
            if (l.setRadius) {
              l.setStyle(l._baseStyle);
            } else if (l.setStyle) {
              l.setStyle({
                weight: l._baseStyle.weight,
                fillOpacity: l._baseStyle.fillOpacity
              });
            }
          }
        }
      });
    }
  });

  const labels = createLabelsLayer(data, nameKey);

  // Build value→color palette if style_by is configured
  let valuePalette = null;
  if (config.style_by && data.features) {
    const key = config.style_by;
    const palette = new Map();
    for (const f of data.features) {
      const val = f.properties?.[key];
      if (val != null && val !== '' && !palette.has(val)) {
        palette.set(val, getDistinctColor(palette.size));
      }
    }
    valuePalette = Object.fromEntries(palette);
  }

  setStatus('Ready');
  return { layer, data, config, labels, valuePalette };
}

// Load KML layer
async function loadKML(config) {
  setStatus(`Loading ${config.name}...`);
  const response = await fetch(config.file);
  const text = await response.text();
  const parser = new DOMParser();
  const kml = parser.parseFromString(text, "text/xml");
  const layer = new L.KML(kml);
  setStatus('Ready');
  return { layer, data: null, config, labels: null };
}

// Load GPX layer
async function loadGPX(config) {
  setStatus(`Loading ${config.name}...`);
  return new Promise((resolve, reject) => {
    const layer = omnivore.gpx(config.file);
    layer.on('ready', () => {
      setStatus('Ready');
      resolve({ layer, data: null, config, labels: null });

// Load KMZ layer (zipped KML)
async function loadKMZ(config) {
  setStatus(`Loading ${config.name}...`);
  const response = await fetch(config.file);
  const arrayBuffer = await response.arrayBuffer();
  const zip = await JSZip.loadAsync(arrayBuffer);

  // Find the .kml file inside the zip
  const kmlFile = Object.keys(zip.files).find(name => name.endsWith('.kml'));
  if (!kmlFile) throw new Error('No KML file found inside KMZ');

  const kmlText = await zip.files[kmlFile].async('string');
  const parser = new DOMParser();
  const kml = parser.parseFromString(kmlText, 'text/xml');
  const layer = new L.KML(kml);

  setStatus('Ready');
  return { layer, data: null, config, labels: null };
}

// Load CSV as point markers
async function loadCSV(config) {
  setStatus(`Loading ${config.name}...`);
  const response = await fetch(config.file);
  const text = await response.text();

  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase());

  const latIdx = headers.findIndex(h => h === 'lat' || h === 'latitude');
  const lngIdx = headers.findIndex(h => h === 'lng' || h === 'lon' || h === 'longitude');
  const typesIdx = headers.findIndex(h => h === 'types');
  const descIdx = headers.findIndex(h => h === 'description');

  if (latIdx === -1 || lngIdx === -1) {
    throw new Error('CSV must have lat/lng columns');
  }

  const markers = [];
  const features = [];  // For label generation

  for (let i = 1; i < lines.length; i++) {
    const values = lines[i].split(',');
    const lat = parseFloat(values[latIdx]);
    const lng = parseFloat(values[lngIdx]);

    if (isNaN(lat) || isNaN(lng)) continue;

    const name = (typesIdx !== -1 ? values[typesIdx] : '') ||
                 (descIdx !== -1 ? values[descIdx] : '');

    const marker = L.circleMarker([lat, lng], {
      radius: 5,
      weight: 1,
      fillOpacity: 0.7
    });

    marker._featureIndex = i - 1;
    marker._featureName = name;

    // Build a property object from all CSV columns for the popup
    const rowProps = {};
    headers.forEach((h, idx) => { if (values[idx] !== undefined) rowProps[h] = values[idx]; });
    marker.bindPopup(() => buildPopupHTML(rowProps), { maxWidth: 340 });

    marker.on({
      mouseover: (e) => {
        setStatus(name || `Point ${i}`, true);
        e.target.setStyle({ radius: 8, weight: 2, fillOpacity: 0.9 });
      },
      mouseout: (e) => {
        clearHoverStatus();
        if (e.target._baseStyle) {
          e.target.setStyle(e.target._baseStyle);
        }
      }
    });

    markers.push(marker);
    features.push({ geometry: { type: 'Point', coordinates: [lng, lat] }, properties: { name } });
  }

  const layer = L.layerGroup(markers);
  layer._markers = markers;  // Store reference for restyling

  const labels = createLabelsLayer({ features });

  setStatus('Ready');
  return { layer, data: { markers }, config, labels };
}

// Style CSV layer
function styleCSVLayer(layerId, layerData) {
  const { layer, config } = layerData;
  const singleMode = isSingleLayerMode();
  const baseHue = getLayerHue(config.id);

  if (!layer._markers) return;

  layer._markers.forEach((marker, i) => {
    const color = singleMode ? getDistinctColor(i) : getShade(baseHue, i);
    marker.setStyle({ color, fillColor: color, weight: 1, fillOpacity: 0.7 });
    marker._baseStyle = { color, fillColor: color, radius: 5, weight: 1, fillOpacity: 0.7 };
  });
}

// Create a GeoRasterLayer from an already-parsed georaster object
function makeGeoRasterLayer(georaster, config) {
  const opacity = rasterOpacities[config.id] ?? 0.7;
  const nBands = georaster.values ? georaster.values.length : georaster.numberOfRasters;
  const hasAlpha = nBands >= 4;
  return new GeoRasterLayer({
    georaster,
    opacity,
    resolution: 256,
    pixelValuesToColorFn: hasAlpha
      ? values => {
          const [r, g, b, a] = values;
          if (a === 0) return null;
          return `rgba(${r},${g},${b},${a / 255})`;
        }
      : undefined
  });
}

// Load GeoTIFF layer
async function loadGeoTIFF(config) {
  setStatus(`Fetching ${config.name}...`);
  const response = await fetch(config.file);
  if (!response.ok) throw new Error(`Fetch failed: ${response.status} ${response.statusText}`);

  setStatus(`Reading ${config.name} (${((response.headers.get('content-length') || 0) / 1e6).toFixed(1)}MB)...`);
  const arrayBuffer = await response.arrayBuffer();

  setStatus(`Parsing ${config.name} GeoTIFF (${(arrayBuffer.byteLength / 1e6).toFixed(1)}MB)...`);
  const georaster = await parseGeoraster(arrayBuffer);

  setStatus(`Rendering ${config.name}...`);
  const layer = makeGeoRasterLayer(georaster, config);

  setStatus('Ready');
  return { layer, data: null, config, labels: null, georaster };
}

// Heatmap of line features (e.g. Strava tracks), drawn as vectors on a canvas.
// Each feature is stroked once into an offscreen canvas with additive blending,
// so a pixel's alpha counts how many features cross it (a feature overlapping
// itself counts once). Counts are then log-scaled and coloured. Redraws on
// every pan/zoom end, so it stays sharp at any zoom.
// Colour ramps from 1 feature to the busiest: "dark" brightens towards white (for the
// dark basemap, like Strava's), "light" deepens towards dark red (for light basemaps).
// A layer entry can force one with "heat": {"palette": "dark" | "light"}; otherwise it
// follows the basemap.
const HEAT_PALETTES = {
  dark:  { stops: [0, 0.35, 0.7, 1], ramp: [[200, 30, 10], [250, 100, 10], [255, 205, 40], [255, 255, 225]] },
  light: { stops: [0, 0.35, 0.7, 1], ramp: [[255, 150, 0], [245, 70, 0], [200, 0, 25], [115, 0, 70]] },
};
const HEAT_UNIT = 4;   // alpha added per feature (0-255): counts up to 63 before saturating

const HeatLinesLayer = L.Renderer.extend({
  options: { padding: 0.1, opacity: 0.7, max: null, palette: null, pane: 'heatPane' },

  redraw() {
    if (this._map) this._update();
    return this;
  },

  initialize(features, options) {
    L.Renderer.prototype.initialize.call(this, options);
    this._features = features;   // [[[lng, lat], ...], ...] per feature
    this._tracks = null;         // projected at zoom 0, built on first draw
  },

  setOpacity(opacity) {
    this.options.opacity = opacity;
    if (this._container) this._container.style.opacity = opacity;
    return this;
  },

  _initContainer() {
    const c = this._container = document.createElement('canvas');
    c.style.pointerEvents = 'none';
    c.style.opacity = this.options.opacity;
    this._ctx = c.getContext('2d');
    this._acc = document.createElement('canvas');
    this._accCtx = this._acc.getContext('2d', { willReadFrequently: true });
  },

  _destroyContainer() {
    L.DomUtil.remove(this._container);
    delete this._ctx;
  },

  _project() {
    // Zoom-0 pixel coordinates; layer points at zoom z are p * scale - pixelOrigin.
    this._tracks = this._features.map(lines => {
      const runs = lines.map(line => {
        const xy = new Float64Array(line.length * 2);
        line.forEach(([lng, lat], i) => {
          const p = this._map.project([lat, lng], 0);
          xy[2 * i] = p.x; xy[2 * i + 1] = p.y;
        });
        return xy;
      });
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const xy of runs) for (let i = 0; i < xy.length; i += 2) {
        if (xy[i] < x0) x0 = xy[i]; if (xy[i] > x1) x1 = xy[i];
        if (xy[i + 1] < y0) y0 = xy[i + 1]; if (xy[i + 1] > y1) y1 = xy[i + 1];
      }
      return { runs, x0, y0, x1, y1 };
    });
  },

  _update() {
    if (this._map._animatingZoom && this._bounds) return;
    L.Renderer.prototype._update.call(this);
    if (!this._tracks) this._project();

    const b = this._bounds, size = b.getSize();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(size.x * dpr), h = Math.round(size.y * dpr);
    const c = this._container;
    L.DomUtil.setPosition(c, b.min);
    c.width = w; c.height = h;
    c.style.width = size.x + 'px'; c.style.height = size.y + 'px';
    this._acc.width = w; this._acc.height = h;

    const map = this._map, z = map.getZoom();
    const scale = map.getZoomScale(z, 0), origin = map.getPixelOrigin();
    // view in zoom-0 coordinates, for skipping tracks that are off screen
    const vx0 = (b.min.x + origin.x) / scale, vy0 = (b.min.y + origin.y) / scale;
    const vx1 = (b.max.x + origin.x) / scale, vy1 = (b.max.y + origin.y) / scale;

    const ctx = this._accCtx;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(0,0,0,${HEAT_UNIT / 255})`;
    ctx.lineWidth = Math.max(1.5, Math.min(4, 1.5 + (z - 12) * 0.5));
    ctx.lineCap = ctx.lineJoin = 'round';
    const ox = origin.x + b.min.x, oy = origin.y + b.min.y;
    let drawn = 0;
    for (const t of this._tracks) {
      if (t.x1 < vx0 || t.x0 > vx1 || t.y1 < vy0 || t.y0 > vy1) continue;
      ctx.beginPath();   // one path per feature: it counts once per pixel
      for (const xy of t.runs) {
        let lx = xy[0] * scale - ox, ly = xy[1] * scale - oy;
        ctx.moveTo(lx, ly);
        for (let i = 2; i < xy.length; i += 2) {
          const x = xy[i] * scale - ox, y = xy[i + 1] * scale - oy;
          if (Math.abs(x - lx) + Math.abs(y - ly) < 0.75 && i < xy.length - 2) continue;  // sub-pixel step
          ctx.lineTo(x, y);
          lx = x; ly = y;
        }
      }
      ctx.stroke();
      drawn++;
    }
    if (!drawn) { this._ctx.clearRect(0, 0, w, h); return; }

    // colourise: alpha (count * HEAT_UNIT) -> ramp, log scale up to the 99th percentile
    const img = ctx.getImageData(0, 0, w, h), px = img.data;
    const hist = new Uint32Array(256);
    for (let i = 3; i < px.length; i += 4) hist[px[i]]++;
    let top;
    if (this.options.max) {
      top = this.options.max;
    } else {
      let total = 0; for (let a = 1; a < 256; a++) total += hist[a];
      let seen = 0, a99 = 255;
      for (let a = 1; a < 256; a++) { seen += hist[a]; if (seen >= total * 0.99) { a99 = a; break; } }
      top = Math.max(3, a99 / HEAT_UNIT);
    }
    // Counted pixels are opaque (the layer's opacity slider sets transparency); only a
    // line's anti-aliased edge (less than one full count) fades, keeping the colour.
    const { stops, ramp } = HEAT_PALETTES[this.options.palette || (activeBaseKey === 'dark' ? 'dark' : 'light')];
    const lut = new Uint8ClampedArray(256 * 4);
    for (let a = 1; a < 256; a++) {
      const n = a / HEAT_UNIT;
      const v = Math.min(1, Math.log1p(Math.max(1, n)) / Math.log1p(top));
      let k = 0; while (k < stops.length - 2 && v > stops[k + 1]) k++;
      const f = Math.max(0, (v - stops[k]) / (stops[k + 1] - stops[k]));
      for (let ch = 0; ch < 3; ch++) lut[a * 4 + ch] = ramp[k][ch] + (ramp[k + 1][ch] - ramp[k][ch]) * f;
      lut[a * 4 + 3] = 255 * Math.min(1, n);
    }
    for (let i = 0; i < px.length; i += 4) {
      const a = px[i + 3] * 4;
      px[i] = lut[a]; px[i + 1] = lut[a + 1]; px[i + 2] = lut[a + 2]; px[i + 3] = lut[a + 3];
    }
    this._ctx.putImageData(img, 0, 0);
  },
});

// Optional layer-entry filter for heat layers:
//   "heat": {"after": "2025-01-01" | "-365d", "before": ..., "types": ["Ride", ...], "max": 20}
// after/before/types test the features' "date" and "type" properties (as written by tools/strava.py).
function heatFilter(spec) {
  if (!spec) return () => true;
  const when = s => {
    if (!s) return null;
    const m = /^-(\d+)d$/.exec(s);
    return m ? Date.now() - m[1] * 864e5 : Date.parse(s);
  };
  const after = when(spec.after), before = when(spec.before);
  const types = spec.types ? new Set(spec.types.map(t => t.toLowerCase())) : null;
  return props => {
    const d = Date.parse(props?.date);
    if ((after || before) && isNaN(d)) return false;
    if (after && d < after) return false;
    if (before && d >= before) return false;
    return !types || types.has(String(props?.type || '').toLowerCase());
  };
}

async function loadHeatLines(config) {
  setStatus(`Loading ${config.name}...`);
  const response = await fetch(config.file);
  if (!response.ok) throw new Error(`HTTP ${response.status} for ${config.file}`);
  const data = await response.json();
  const keep = heatFilter(config.heat);
  const features = [];
  for (const f of data.features || []) {
    const g = f.geometry;
    if (!g || !keep(f.properties)) continue;
    if (g.type === 'LineString') features.push([g.coordinates]);
    else if (g.type === 'MultiLineString') features.push(g.coordinates);
  }
  if (!map.getPane('heatPane')) {
    const pane = map.createPane('heatPane');
    pane.style.zIndex = 350;          // above tiles and rasters, below vector overlays (400)
    pane.style.pointerEvents = 'none';
  }
  const layer = new HeatLinesLayer(features, {
    opacity: rasterOpacities[config.id] ?? 0.7,
    max: config.heat?.max || null,
    palette: HEAT_PALETTES[config.heat?.palette] ? config.heat.palette : null,
  });
  setStatus(`${config.name}: ${features.length} tracks`);
  return { layer, data: null, config, labels: null };
}

// Load ArcGIS tile layer
function loadTileLayer(config) {
  const opacity = rasterOpacities[config.id] ?? 0.7;
  const layer = L.tileLayer(config.file, {
    maxNativeZoom: config.max_zoom || 12,
    maxZoom: 20,
    opacity,
    zIndex: 3,
    attribution: config.attribution || ''
  });
  return { layer, data: null, config, labels: null };
}

// Toggle layer visibility
async function toggleLayer(config, checkbox) {
  const layerId = config.id;
  const isVector = !['geotiff', 'tile', 'heat'].includes(config.type);

  if (checkbox.checked) {
    checkbox.parentElement.classList.add('loading');

    try {
      if (!loadedLayers[layerId]) {
        let layerData;
        switch (config.type) {
          case 'geojson':
            layerData = await loadGeoJSON(config);
            break;
          case 'kml':
            layerData = await loadKML(config);
            break;
          case 'kmz':
            layerData = await loadKMZ(config);
            break;
          case 'gpx':
            layerData = await loadGPX(config);
            break;
          case 'csv':
            layerData = await loadCSV(config);
            break;
          case 'geotiff':
            layerData = await loadGeoTIFF(config);
            break;
          case 'tile':
            layerData = loadTileLayer(config);
            break;
          case 'heat':
            layerData = await loadHeatLines(config);
            break;
        }
        loadedLayers[layerId] = layerData;
        loadedLayers[layerId].layer.addTo(map);
      } else if (config.type === 'geotiff') {
        // GeoRasterLayer tiles render asynchronously; avoid remove+addTo races by
        // keeping the layer in the map permanently and toggling via setOpacity.
        const opacity = rasterOpacities[config.id] ?? 0.7;
        loadedLayers[layerId].layer.setOpacity(opacity);
      } else {
        loadedLayers[layerId].layer.addTo(map);
      }

      if (isVector) {
        activeVectorLayers.add(layerId);
      }

      // Style and update labels
      if (config.type === 'geojson') {
        styleGeoJSONLayer(layerId, loadedLayers[layerId]);
      } else if (config.type === 'csv') {
        styleCSVLayer(layerId, loadedLayers[layerId]);
      }

      // Update all layers for mode change
      if (isVector) {
        updateAllLayerStyles();
      }

      updateHash();

    } catch (err) {
      console.error(`Failed to load ${config.name}:`, err);
      setStatus(`Error: ${config.name} — ${err.message}`);
      checkbox.checked = false;
    }

    checkbox.parentElement.classList.remove('loading');
  } else {
    if (loadedLayers[layerId]) {
      if (config.type === 'geotiff') {
        // Keep the layer in the map — toggling via setOpacity avoids async tile render races.
        loadedLayers[layerId].layer.setOpacity(0);
      } else {
        map.removeLayer(loadedLayers[layerId].layer);
        if (loadedLayers[layerId].labels) {
          map.removeLayer(loadedLayers[layerId].labels);
        }
      }
    }

    if (isVector) {
      activeVectorLayers.delete(layerId);
      updateAllLayerStyles();
    }

    updateHash();
  }
}

// Update raster opacity
function updateRasterOpacity(config, value) {
  rasterOpacities[config.id] = value;
  if (loadedLayers[config.id] && loadedLayers[config.id].layer) {
    loadedLayers[config.id].layer.setOpacity(value);
  }
}

// Serialize current UI state to the URL hash
function updateHash() {
  const parts = [];

  // r: only included when some regions are collapsed (default is all expanded)
  const collapsedKeys = Object.entries(topSectionDivs)
    .filter(([, div]) => div.classList.contains('collapsed'))
    .map(([k]) => k);
  if (collapsedKeys.length > 0) {
    const expandedKeys = Object.keys(topSectionDivs)
      .filter(k => !collapsedKeys.includes(k));
    if (expandedKeys.length > 0) parts.push('r=' + expandedKeys.join(','));
  }

  // b: base layer (omitted when default)
  if (activeBaseKey !== DEFAULT_BASE_LAYER) {
    parts.push('b=' + activeBaseKey);
  }

  // l: active vector layers
  if (activeVectorLayers.size > 0) {
    parts.push('l=' + [...activeVectorLayers].join(','));
  }

  history.replaceState(null, '', parts.length ? '#' + parts.join('&') : location.pathname + location.search);
}

// Restore UI state from the URL hash
async function applyHash() {
  const hash = location.hash.slice(1);
  if (!hash) return;

  const params = {};
  for (const part of hash.split('&')) {
    const eq = part.indexOf('=');
    if (eq !== -1) params[part.slice(0, eq)] = part.slice(eq + 1);
  }

  // b: base layer
  if (params.b && BASE_LAYER_DEFS[params.b]) {
    Object.values(BASE_LAYER_DEFS).forEach(({layer}) => {
      if (map.hasLayer(layer)) map.removeLayer(layer);
    });
    BASE_LAYER_DEFS[params.b].layer.addTo(map);
    activeBaseKey = params.b;
  }

  // Collapse sections not listed in r, and center map on the first listed region
  if (params.r) {
    const expandedKeys = params.r.split(',');
    const expandedSet = new Set(expandedKeys);
    for (const [key, div] of Object.entries(topSectionDivs)) {
      if (!expandedSet.has(key) && !div.classList.contains('collapsed')) {
        div.classList.add('collapsed');
        div.querySelector('.arrow').textContent = '▶';
      }
    }
    const view = REGION_VIEWS[expandedKeys[0]];
    if (view) {
      map.setView(view.center, view.zoom);
      autoCenterOnUser = false;
    }
  }

  // Enable layers listed in l
  if (params.l) {
    for (const layerId of params.l.split(',')) {
      const config = layerConfigs[layerId];
      const checkbox = layerCheckboxes[layerId];
      if (config && checkbox && !checkbox.checked && !checkbox.disabled) {
        checkbox.checked = true;
        await toggleLayer(config, checkbox);
      }
    }
  }
}

// Filter layer items by search query
function applySearch(query) {
  const q = query.trim().toLowerCase();
  const panel = document.getElementById('panel');

  if (!q) {
    panel.classList.remove('searching');
    document.querySelectorAll('.layer-item, .category, .top-section').forEach(el => {
      el.style.display = '';
    });
    return;
  }

  panel.classList.add('searching');

  for (const sec of document.querySelectorAll('.top-section')) {
    let secVisible = false;
    for (const cat of sec.querySelectorAll('.category')) {
      let catVisible = false;
      for (const item of cat.querySelectorAll('.layer-item')) {
        const matches = item.querySelector('label').textContent.toLowerCase().includes(q);
        item.style.display = matches ? '' : 'none';
        if (matches) catVisible = true;
      }
      cat.style.display = catVisible ? '' : 'none';
      if (catVisible) secVisible = true;
    }
    sec.style.display = secVisible ? '' : 'none';
  }
}

// Wire up search input (called after DOM is ready)
function initSearch() {
  const input = document.getElementById('search-input');
  const clear = document.getElementById('search-clear');

  input.addEventListener('input', () => {
    clear.style.display = input.value ? 'block' : 'none';
    applySearch(input.value);
  });

  clear.addEventListener('click', () => {
    input.value = '';
    clear.style.display = 'none';
    applySearch('');
    input.focus();
  });
}

// Wire up collapse toggles for the Search and Layers panel sections
function initPanelSections() {
  for (const section of document.querySelectorAll('.panel-section')) {
    const header = section.querySelector('.panel-section-header');
    const arrow = header.querySelector('.arrow');
    header.addEventListener('click', () => {
      section.classList.toggle('collapsed');
      arrow.textContent = section.classList.contains('collapsed') ? '▶' : '▼';
    });
  }
}

// --- Link mode: bike from the Link light rail station nearest the destination ---
const LINK_STATIONS_FILE = 'seattle/seattle-link-rail-stations.geojson';
let linkStations = null;     // cached station features

function distMeters(lat1, lng1, lat2, lng2) {
  const kx = 111320 * Math.cos((lat1 + lat2) / 2 * Math.PI / 180);
  return Math.hypot((lng2 - lng1) * kx, (lat2 - lat1) * 110574);
}

async function nearestLinkRailStation(lat, lng) {
  if (!linkStations) {
    const url = resolveDataFile(LINK_STATIONS_FILE);
    const gj = url && await fetchJSON(url);
    if (!gj) throw new Error(`${LINK_STATIONS_FILE} not available`);
    linkStations = gj.features.filter(f => f.geometry?.type === 'Point');
  }
  let nearest = null, minDist = Infinity;
  for (const f of linkStations) {
    const [fLng, fLat] = f.geometry.coordinates;
    const d = distMeters(lat, lng, fLat, fLng);
    if (d < minDist) { minDist = d; nearest = f; }
  }
  return nearest;
}

async function routeLink(destLat, destLng) {
  setStatus('Finding nearest Link station…');
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  try {
    const station = await nearestLinkRailStation(destLat, destLng);
    const [sLng, sLat] = station.geometry.coordinates;
    const name = station.properties.name || 'Link station';
    setStatus(`Routing from ${name}…`);
    const geojson = await orsRequest('directions', 'cycling-regular',
      { coordinates: [[sLng, sLat], [destLng, destLat]] });

    const line = L.geoJSON(geojson, { style: { color: ROUTE_COLOR, weight: 4, opacity: 0.8 } });
    const marker = L.circleMarker([sLat, sLng], {
      radius: 7, color: ROUTE_COLOR, fillColor: '#fff', fillOpacity: 1, weight: 2
    }).bindTooltip(name);
    routeLayer = L.layerGroup([line, marker]).addTo(map);
    map.fitBounds(line.getBounds(), { padding: [20, 20] });

    const summary = geojson.features[0]?.properties?.summary;
    setStatus(summary
      ? `${name} → here: ${formatDistance(summary.distance)} · ${Math.round(summary.duration / 60)} min by bike`
      : `Bike from ${name}`);
  } catch (err) {
    setStatus(`Link routing failed: ${err.message}`);
  }
}

// Route from current location to dest using the given ORS profile
// Travel mode for directions and reach areas: the last one picked in a popup
const TRAVEL_MODES = [['bike', 'cycling-regular'], ['walk', 'foot-walking'], ['drive', 'driving-car']];
let travelMode = 'cycling-regular';
const modeName = profile => (TRAVEL_MODES.find(([, p]) => p === profile) || [profile])[0];
function setTravelMode(profile) {
  travelMode = profile;
  document.querySelectorAll('.reach-mode').forEach(el => { el.textContent = `Reach (${modeName(profile)}):`; });
}

// POST to OpenRouteService directly (ors_key, local use) or through the server proxy
// (ors_proxy). service: 'directions' or 'isochrones'. Returns geojson, or throws.
async function orsRequest(service, profile, body) {
  const { ors_proxy, ors_key } = APP_CONFIG;
  if (!ors_proxy && !ors_key) throw new Error('routing not configured (ors_proxy or ors_key in config.json)');
  const url = ors_key
    ? (service === 'directions' ? `${ORS_DIRECT_URL}${profile}/geojson` : `${ORS_ISOCHRONE_URL}${profile}`)
    : `${ors_proxy}?profile=${encodeURIComponent(profile)}${service === 'directions' ? '' : '&service=' + service}`;
  const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json, application/geo+json' };
  if (ors_key) headers['Authorization'] = ors_key;
  const resp = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body) });
  if (!resp.ok) {
    let msg = `HTTP ${resp.status}`;
    try { const j = await resp.json(); msg = j.error?.message || j.error || msg; } catch {}
    throw new Error(msg);
  }
  return resp.json();
}

// --- Reach areas (isochrones): where you can get to in 10 / 20 / 30 minutes ---
const ORS_ISOCHRONE_URL = 'https://api.heigit.org/openrouteservice/v2/isochrones/';
const REACH_COLOR = '#0891b2';
const REACH_CHOICES = [['10', 10], ['20', 20], ['30', 30]];   // minutes
let reachLayer = null;
let reachAnchor = null;      // 'user' when drawn from the location dot
let reachRequest = 0;        // drops responses to superseded clicks

function clearReach() {
  reachRequest++;
  if (reachLayer) { map.removeLayer(reachLayer); reachLayer = null; }
  reachAnchor = null;
}

// Nested areas for every 10-minute step up to `minutes`, darker toward the centre
async function drawReach(latlng, minutes, anchor) {
  clearReach();
  const req = reachRequest;
  const profile = travelMode;
  const steps = REACH_CHOICES.map(([, m]) => m).filter(m => m <= minutes);
  setStatus(`Finding where you can get within ${minutes} min by ${modeName(profile)}…`);
  try {
    const gj = await orsRequest('isochrones', profile,
      { locations: [[latlng.lng, latlng.lat]], range: steps.map(m => m * 60) });
    if (req !== reachRequest) return;    // cleared or replaced meanwhile
    const feats = (gj.features || []).sort((a, b) => b.properties.value - a.properties.value);
    const group = L.layerGroup();
    for (const f of feats) {
      const mins = Math.round(f.properties.value / 60);
      const poly = L.geoJSON(f, { interactive: false, style: {
        color: REACH_COLOR, weight: mins === minutes ? 2 : 1, opacity: 0.8,
        fillColor: REACH_COLOR, fillOpacity: 0.12,
      } });
      group.addLayer(poly);
      // label at the area's northernmost point
      let top = null;
      poly.eachLayer(l => l.getLatLngs().flat(3).forEach(p => { if (!top || p.lat > top.lat) top = p; }));
      if (top) group.addLayer(mapLabel(top, `${mins} min`, 'radius-label reach-label', 'above'));
    }
    reachLayer = group.addTo(map);
    reachAnchor = anchor;
    const bounds = L.featureGroup(group.getLayers().filter(l => l instanceof L.GeoJSON)).getBounds();
    if (bounds.isValid() && !map.getBounds().contains(bounds)) map.fitBounds(bounds, { padding: [20, 20] });
    setStatus(`Shaded: reachable within ${steps.join(' / ')} min by ${modeName(profile)}`);
  } catch (err) {
    if (req === reachRequest) setStatus(`Reach areas failed: ${err.message}`);
  }
}

// "Reach (bike): 10 20 30 min", using the current travel mode
function reachRow(getLatLng, anchor) {
  const label = Object.assign(document.createElement('span'),
    { className: 'reach-mode', textContent: `Reach (${modeName(travelMode)}):` });
  return toggleRow(label, REACH_CHOICES, 'min', 'reach-btn',
    minutes => drawReach(getLatLng(), minutes, anchor), clearReach);
}

async function routeTo(destLat, destLng, profile = 'cycling-regular') {
  if (!userLatLng) {
    setStatus('Enable location sharing to get directions');
    return;
  }
  setStatus('Getting directions…');
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }

  try {
    const geojson = await orsRequest('directions', profile,
      { coordinates: [[userLatLng.lng, userLatLng.lat], [destLng, destLat]] });

    routeLayer = L.geoJSON(geojson, {
      style: { color: ROUTE_COLOR, weight: 4, opacity: 0.8 }
    }).addTo(map);
    map.fitBounds(routeLayer.getBounds(), { padding: [20, 20] });

    const summary = geojson.features[0]?.properties?.summary;
    if (summary) {
      const mins = Math.round(summary.duration / 60);
      setStatus(`${formatDistance(summary.distance)} · ${mins} min by ${modeName(profile)}`);
    } else {
      setStatus('Route found');
    }
  } catch (err) {
    setStatus(`Routing failed: ${err.message}`);
  }
}

// Place a destination marker with a directions popup at the given coordinates
function setDestination(lat, lng, label) {
  if (searchMarker) map.removeLayer(searchMarker);
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  if (radiusAnchor !== 'user') clearRadius();
  if (reachAnchor !== 'user') clearReach();

  const popupEl = document.createElement('div');
  popupEl.style.cssText = 'font-size:11px;max-width:190px';
  const nameEl = document.createElement('div');
  nameEl.textContent = label;
  nameEl.style.marginBottom = '6px';
  const dirRow = document.createElement('div');
  dirRow.style.cssText = 'display:flex;align-items:center;gap:4px';
  const btnStyle = 'font-size:11px;padding:2px 7px;cursor:pointer;'
    + 'font-family:inherit;background:#2563eb;color:white;border:none;border-radius:4px';
  const modeBtns = [];
  for (const [label, profile] of TRAVEL_MODES) {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.style.cssText = btnStyle;
    btn.onclick = () => {
      modeBtns.forEach(b => b.style.outline = '');
      btn.style.outline = `2px solid ${ROUTE_COLOR}`;
      setTravelMode(profile);
      routeTo(lat, lng, profile);
    };
    modeBtns.push(btn);
    dirRow.appendChild(btn);
  }
  if (resolveDataFile(LINK_STATIONS_FILE)) {
    const linkBtn = document.createElement('button');
    linkBtn.textContent = 'link*';
    linkBtn.title = 'Bike route from the Link light rail station nearest here';
    linkBtn.style.cssText = btnStyle;
    linkBtn.onclick = () => {
      modeBtns.forEach(b => b.style.outline = '');
      linkBtn.style.outline = `2px solid ${ROUTE_COLOR}`;
      setTravelMode('cycling-regular');
      routeLink(lat, lng);
    };
    modeBtns.push(linkBtn);
    dirRow.appendChild(linkBtn);
  }
  popupEl.appendChild(nameEl);
  popupEl.appendChild(dirRow);
  popupEl.appendChild(radiusRow(() => L.latLng(lat, lng), 'pin'));
  popupEl.appendChild(reachRow(() => L.latLng(lat, lng), 'pin'));

  searchMarker = L.marker([lat, lng]).addTo(map)
    .bindPopup(popupEl).openPopup();
}

// Geocoder: address/place search via Nominatim
function initGeocoder() {
  const input = document.getElementById('geocode-input');
  const submit = document.getElementById('geocode-submit');
  const resultsDiv = document.getElementById('geocode-results');

  async function doSearch() {
    const q = input.value.trim();
    if (!q) return;

    resultsDiv.innerHTML = '<div class="geocode-status">Searching…</div>';
    if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }

    try {
      const bounds = map.getBounds();
      const viewbox = [
        bounds.getWest(), bounds.getSouth(),
        bounds.getEast(), bounds.getNorth()
      ].join(',');
      const url = 'https://nominatim.openstreetmap.org/search?q='
        + encodeURIComponent(q) + '&format=json&limit=5&viewbox=' + viewbox;
      const resp = await fetch(url, { headers: { 'Accept-Language': 'en' } });
      const results = await resp.json();

      resultsDiv.innerHTML = '';
      if (!results.length) {
        resultsDiv.innerHTML = '<div class="geocode-status">No results found</div>';
        return;
      }

      for (const r of results) {
        const item = document.createElement('div');
        item.className = 'geocode-result';
        item.textContent = r.display_name;
        item.addEventListener('click', () => {
          const lat = parseFloat(r.lat);
          const lng = parseFloat(r.lon);
          map.setView([lat, lng], 14);
          setDestination(lat, lng, r.display_name);
          resultsDiv.innerHTML = '';
          input.value = r.display_name;
        });
        resultsDiv.appendChild(item);
      }
    } catch (err) {
      resultsDiv.innerHTML = '<div class="geocode-status">Search failed</div>';
    }
  }

  input.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  submit.addEventListener('click', doSearch);
}

// Build the layer panel UI
function buildPanel() {
  const content = document.getElementById('layers-content');

  for (const [topName, subCategories] of Object.entries(LAYERS)) {
    const topKey = TOP_LEVEL_KEYS[topName] || topName.toLowerCase();
    const topDiv = document.createElement('div');
    topDiv.className = 'top-section';
    topSectionDivs[topKey] = topDiv;

    const topHeader = document.createElement('div');
    topHeader.className = 'top-header';
    topHeader.innerHTML = `<span>${topName}</span><span class="arrow">▼</span>`;
    topHeader.onclick = () => {
      topDiv.classList.toggle('collapsed');
      topHeader.querySelector('.arrow').textContent =
        topDiv.classList.contains('collapsed') ? '▶' : '▼';
      updateHash();
    };

    const topContent = document.createElement('div');
    topContent.className = 'top-content';

    for (const [subName, layers] of Object.entries(subCategories)) {
      const categoryDiv = document.createElement('div');
      categoryDiv.className = 'category';

      const header = document.createElement('div');
      header.className = 'category-header';
      header.innerHTML = `<span>${subName}</span><span>▼</span>`;
      header.onclick = () => {
        categoryDiv.classList.toggle('collapsed');
        header.querySelector('span:last-child').textContent =
          categoryDiv.classList.contains('collapsed') ? '▶' : '▼';
      };

      const items = document.createElement('div');
      items.className = 'category-items';

      for (const layer of layers) {
        const item = document.createElement('div');
        item.className = 'layer-item';

        layerConfigs[layer.id] = layer;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = `layer-${layer.id}`;
        if (!layer.available) {
          checkbox.disabled = true;
          item.classList.add('unavailable');
          item.title = `${layer.path} is not in any data root on this machine`;
        }
        checkbox.onchange = () => toggleLayer(layer, checkbox);
        layerCheckboxes[layer.id] = checkbox;

        const label = document.createElement('label');
        label.htmlFor = `layer-${layer.id}`;
        label.textContent = layer.name;

        const swatch = document.createElement('span');
        swatch.className = 'layer-swatch';
        layerSwatches[layer.id] = swatch;

        const format = document.createElement('span');
        format.className = 'format';
        format.textContent = layer.type;

        item.appendChild(checkbox);
        item.appendChild(label);
        item.appendChild(swatch);
        item.appendChild(format);
        items.appendChild(item);

        if (layer.type === 'geotiff' || layer.type === 'tile' || layer.type === 'heat') {
          const opacityControl = document.createElement('div');
          opacityControl.className = 'opacity-control';
          opacityControl.style.display = 'none';

          const slider = document.createElement('input');
          slider.type = 'range';
          slider.min = '0';
          slider.max = '100';
          slider.value = '70';

          const valueLabel = document.createElement('span');
          valueLabel.textContent = '70%';

          slider.oninput = () => {
            const pct = parseInt(slider.value);
            valueLabel.textContent = `${pct}%`;
            updateRasterOpacity(layer, pct / 100);
          };

          opacityControl.appendChild(document.createTextNode('Opacity:'));
          opacityControl.appendChild(slider);
          opacityControl.appendChild(valueLabel);
          items.appendChild(opacityControl);

          // Show/hide opacity slider with checkbox state
          checkbox.addEventListener('change', () => {
            opacityControl.style.display = checkbox.checked ? 'flex' : 'none';
          });
        }
      }

      categoryDiv.appendChild(header);
      categoryDiv.appendChild(items);
      topContent.appendChild(categoryDiv);
    }

    topDiv.appendChild(topHeader);
    topDiv.appendChild(topContent);
    content.appendChild(topDiv);
  }
}

// Panel toggle
document.getElementById('panel-header').onclick = (e) => {
  if (e.target.id !== 'toggle-btn') return;
  const panel = document.getElementById('panel');
  panel.classList.toggle('collapsed');
  document.getElementById('toggle-btn').textContent =
    panel.classList.contains('collapsed') ? '+' : '−';
};

// Clear hover on map click
map.on('click', clearHoverStatus);

// Right-click / long-press on map sets destination
map.on('contextmenu', e => {
  const { lat, lng } = e.latlng;
  const label = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  setDestination(lat, lng, label);
});

// Initialize - load config.json, the data root listings, then every layer set
async function init() {
  try {
    setStatus('Loading layer catalog...');
    await loadAppConfig();
    applyCartoKey();

    const sets = await Promise.all(APP_CONFIG.layer_sets.map(async url => {
      const set = await fetchJSON(url);
      if (!set) console.warn(`Layer set not found: ${url}`);
      return set || [];
    }));
    const rawLayers = sets.flat();

    LAYERS = parseLayersConfig(rawLayers);
    buildPanel();
    initSearch();
    initPanelSections();
    initGeocoder();
    await applyHash();
    const missing = Object.values(layerConfigs).filter(c => !c.available).length;
    setStatus(missing ? `Ready — ${missing} layer${missing > 1 ? 's' : ''} not on this machine` : 'Ready');
  } catch (err) {
    console.error('Failed to load layer catalog:', err);
    setStatus(`Error loading layer catalog: ${err.message}`);
  }
}

init();

// Register service worker for PWA / offline support
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}

// --- Geolocation: current position dot + locate button ---
(function() {
  let locationMarker = null;
  let accuracyCircle = null;
  let watchId = null;

  // Create locate control
  const LocateControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd() {
      const btn = L.DomUtil.create('div', 'locate-btn leaflet-bar');
      btn.innerHTML = '⌖';
      btn.title = 'Center on current location';
      L.DomEvent.disableClickPropagation(btn);
      btn.onclick = () => {
        if (locationMarker) {
          map.setView(locationMarker.getLatLng(), Math.max(map.getZoom(), 14));
        } else {
          // Trigger a one-shot locate if we don't have position yet
          map.locate({ setView: true, maxZoom: 14 });
        }
      };
      this._btn = btn;
      return btn;
    }
  });

  const locateControl = new LocateControl();
  map.addControl(locateControl);

  function updatePosition(lat, lng, accuracy) {
    userLatLng = L.latLng(lat, lng);
    if (autoCenterOnUser) {
      autoCenterOnUser = false;   // only the first fix; after that the user drives the map
      map.setView(userLatLng, 14);
    }
    if (!locationMarker) {
      locationMarker = L.circleMarker([lat, lng], {
        radius: 8,
        fillColor: '#2563eb',
        fillOpacity: 1,
        color: 'white',
        weight: 3,
        pane: 'markerPane'
      }).addTo(map);
      const popupEl = document.createElement('div');
      popupEl.style.cssText = 'font-size:11px;max-width:190px';
      popupEl.appendChild(Object.assign(document.createElement('div'), { textContent: 'Your location' }));
      popupEl.appendChild(radiusRow(() => locationMarker.getLatLng(), 'user'));
      popupEl.appendChild(reachRow(() => locationMarker.getLatLng(), 'user'));
      locationMarker.bindPopup(popupEl);

      accuracyCircle = L.circle([lat, lng], {
        radius: accuracy,
        fillColor: '#2563eb',
        fillOpacity: 0.08,
        color: '#2563eb',
        weight: 1,
        opacity: 0.3,
        interactive: false
      }).addTo(map);
    } else {
      locationMarker.setLatLng([lat, lng]);
      accuracyCircle.setLatLng([lat, lng]);
      accuracyCircle.setRadius(accuracy);
    }
    if (radiusAnchor === 'user') moveRadius([lat, lng]);
    locateControl._btn.classList.add('active');
  }

  // Watch position continuously
  if ('geolocation' in navigator) {
    watchId = navigator.geolocation.watchPosition(
      (pos) => updatePosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
      (err) => console.warn('Geolocation error:', err.message),
      { enableHighAccuracy: true, maximumAge: 10000 }
    );
  }

  // Also handle Leaflet's locate events (for the button fallback)
  map.on('locationfound', (e) => updatePosition(e.latitude, e.longitude, e.accuracy));
})();

// --- Measure distance: ruler button, tap points, running total ---
// Button cycles: start measuring -> finish (keep the line) -> clear. While measuring,
// Esc finishes and Backspace removes the last point; features ignore taps.
(function() {
  const COLOR = '#0f766e';
  let state = 'idle';          // idle | measuring | done
  let points = [];
  let group = null;            // line, vertices, total label
  let line = null, rubber = null, total = null;
  let btn = null;

  const RULER_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
    + 'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 17 3l4 4L7 21z"/>'
    + '<path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg>';

  const lengthOf = pts => pts.reduce((sum, p, i) => i ? sum + map.distance(pts[i - 1], p) : 0, 0);

  function redraw() {
    line.setLatLngs(points);
    if (total) { group.removeLayer(total); total = null; }
    if (!points.length) return;
    const last = points[points.length - 1];
    const leg = points.length > 1 ? map.distance(points[points.length - 2], last) : 0;
    const text = points.length > 1
      ? formatDistance(lengthOf(points)) + (points.length > 2 ? ` <span style="font-weight:400">(+${formatDistance(leg)})</span>` : '')
      : 'tap the next point';
    total = mapLabel(last, text, 'measure-label', 'right').addTo(group);
    if (state === 'measuring' && points.length > 1)
      setStatus(`Measuring: ${formatDistance(lengthOf(points))} · Backspace undoes · ruler or Esc finishes`);
  }

  function addPoint(e) {
    const prev = points[points.length - 1];
    points.push(e.latlng);
    const legText = prev ? `leg ${formatDistance(map.distance(prev, e.latlng))}, total ${formatDistance(lengthOf(points))}` : 'start';
    L.circleMarker(e.latlng, { radius: 4, color: COLOR, weight: 2, fillColor: 'white', fillOpacity: 1 })
      .bindTooltip(legText, { direction: 'top', className: 'measure-label' })
      .addTo(group);
    redraw();
  }

  function undo() {
    if (!points.length) return;
    points.pop();
    const vertices = group.getLayers().filter(l => l instanceof L.CircleMarker);
    group.removeLayer(vertices[vertices.length - 1]);
    rubber.setLatLngs([]);
    redraw();
  }

  function onMove(e) {
    if (!points.length) return;
    rubber.setLatLngs([points[points.length - 1], e.latlng]);
  }

  function onKey(e) {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (e.key === 'Escape') finish();
    else if (e.key === 'Backspace') { e.preventDefault(); undo(); }
  }

  function start() {
    clear();
    state = 'measuring';
    map.closePopup();
    group = L.layerGroup().addTo(map);
    line = L.polyline([], { color: COLOR, weight: 3, dashArray: '8 6', interactive: false }).addTo(group);
    rubber = L.polyline([], { color: COLOR, weight: 2, dashArray: '2 6', opacity: 0.7, interactive: false }).addTo(group);
    total = null;
    map.getContainer().classList.add('measuring');
    map.doubleClickZoom.disable();       // quick taps add points instead of zooming
    map.on('click', addPoint);
    map.on('mousemove', onMove);
    document.addEventListener('keydown', onKey);
    btn.classList.add('active');
    btn.title = 'Finish measuring (Esc)';
    setStatus('Measuring: tap points on the map · Backspace undoes · ruler or Esc finishes');
  }

  function stopListening() {
    map.getContainer().classList.remove('measuring');
    map.doubleClickZoom.enable();
    map.off('click', addPoint);
    map.off('mousemove', onMove);
    document.removeEventListener('keydown', onKey);
  }

  function finish() {
    stopListening();
    if (rubber) rubber.setLatLngs([]);
    if (points.length < 2) { clear(); return; }
    state = 'done';
    btn.classList.remove('active');
    btn.title = 'Clear measurement';
    setStatus(`Distance: ${formatDistance(lengthOf(points))}`);
  }

  function clear() {
    stopListening();
    if (group) map.removeLayer(group);
    group = line = rubber = total = null;
    points = [];
    state = 'idle';
    if (btn) { btn.classList.remove('active'); btn.title = 'Measure distance'; }
    clearHoverStatus();
  }

  const MeasureControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd() {
      btn = L.DomUtil.create('div', 'locate-btn leaflet-bar');
      btn.innerHTML = RULER_SVG;
      btn.title = 'Measure distance';
      L.DomEvent.disableClickPropagation(btn);
      btn.onclick = () => (state === 'idle' ? start() : state === 'measuring' ? finish() : clear());
      return btn;
    }
  });
  map.addControl(new MeasureControl());
})();
